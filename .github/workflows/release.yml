name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: Check release plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      package_exists: ${{ steps.package-state.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm health
      - name: Check whether the package has its initial npm release
        id: package-state
        run: |
          if npm view panel-frame-ui version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select release mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Prepare version pull request
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          script: pnpm changeset version
          pr-title: Version Packages
          commit-message: Version Packages

  publish:
    name: Publish package
    needs: plan
    if: needs.plan.outputs.mode == 'publish' && needs.plan.outputs.package_exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          script: pnpm changeset publish
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true
