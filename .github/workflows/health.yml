name: Repository health

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  health:
    name: Repository health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: pnpm install --frozen-lockfile
      - name: Install RepNix security and workflow scanners
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare the OSV vulnerability database
        continue-on-error: true
        run: osv-scanner scan source --offline-vulnerabilities --download-offline-databases --format=json --recursive .
      - run: pnpm health
